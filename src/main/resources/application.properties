# Porta da aplicacao
server.port=8080

# Nome da aplicacao (aparece em logs/actuator)
spring.application.name=imdb-movie-api

# ---------------------------------------------------------------------------
# Configuracao da OMDb API (base de dados do IMDB)
# Crie sua chave gratuita em: https://www.omdbapi.com/apikey.aspx
#
# A chave NUNCA deve ser commitada no codigo. Ela e lida da variavel de
# ambiente OMDB_API_KEY. Para rodar localmente, configure essa variavel
# de ambiente na sua IDE (veja o README) ou exporte no terminal:
#   export OMDB_API_KEY=sua-chave-aqui
# ---------------------------------------------------------------------------
omdb.api-key=${OMDB_API_KEY}
omdb.base-url=http://www.omdbapi.com/

# Logging
logging.level.com.felps.imdbmovieapi=INFO
